<div class="split-section split-section-text-right">
  <figure class="column image-column" style="flex-basis: 30%; min-width: 200px; max-width: 250px">
    <img src="https://img-mp.maiporter.de/BILD" alt="ALT" />
  </figure>

  <div class="column text-column" style="flex-basis: 70%">

  </div>
</div>

    <img src="https://img-mp.maiporter.de/BILD" alt="ALT" />
  </figure>

  <div class="column text-column" style="flex-basis: 70%">
    <p>TEXT</p>
  </div>
</div>

<div class="split-section reverse mobile-text-first"></div>
