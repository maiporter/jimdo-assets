<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaiPorter - SEITENTITEL</title>

    <!-- Eigene Styles (2 Ebenen nach oben) -->
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <!-- 1. HEADER (Logo + Nav-Ziel oben) -->
    <header class="page-header">
      <div id="page-header-container"></div>
      <div id="page-nav-header"></div>
    </header>

    <!-- 2. SEITENTITEL -->
    <div class="page-title">
      <h1>VORLAGE</h1>
      <div>
        <svg class="mai-line line-1" width="100%" height="5">
          <line class="svg-line" x1="0" y1="4.5" x2="100%" y2="4.5"></line>
        </svg>
      </div>
    </div>

    <!-- 3. SEITENINHALT -->
    <div class="page-content">
      <!-- Hier kommt der eigentliche Inhalt rein -->
    </div>

    <!-- SKRIPT: JIMDO STYLE-ISOLIERUNG -->
    <script type="text/javascript">
      /* <![CDATA[ */
      document.addEventListener("DOMContentLoaded", function () {
        const wrappers = document.querySelectorAll(".v2-wrapper");
        wrappers.forEach((wrapper) => {
          const affectedElements = wrapper.querySelectorAll(".j-text, .j-htmlCode, .cc-m-spacer, .j-moduleBox");
          affectedElements.forEach((el) => {
            el.style.setProperty("all", "unset", "important");
            el.style.setProperty("display", "block", "important");
          });
        });
      });
      /*]]>*/
    </script>

    <!-- 4. FOOTER (Ziel für Legal Footer inkl. innerem Nav-Ziel #page-nav-footer) -->
    <footer class="page-footer">
      <div id="page-footer-container"></div>
    </footer>

    <!-- DYNAMISCHES NACHLADE-SKRIPT -->
    <script type="text/javascript">
      /* <![CDATA[ */
      document.addEventListener("DOMContentLoaded", function () {
        const isLocal = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";

        // Basispfade für Vorlagen (2 Ebenen nach oben)
        const headerUrl = isLocal ? "../../templates/navigation/page-header.html" : "/navigation/header";
        const navUrl = isLocal ? "../../templates/navigation/page-navigation.html" : "/navigation/nav";
        const footerUrl = isLocal ? "../../templates/navigation/page-footer.html" : "/navigation/footer";

        // 1. Header laden
        fetch(headerUrl)
          .then((res) => res.text())
          .then((html) => {
            const container = document.getElementById("page-header-container");
            if (container) container.innerHTML = html;
          })
          .catch((err) => console.warn("Header-Fehler:", err));

        // 2. Legal Footer laden
        const footerPromise = fetch(footerUrl)
          .then((res) => res.text())
          .then((html) => {
            const container = document.getElementById("page-footer-container");
            if (container) container.innerHTML = html;
          });

        // 3. Navigation 1x laden und verteilen (erst wenn der Footer bereitsteht)
        Promise.all([fetch(navUrl).then((res) => res.text()), footerPromise])
          .then(([navHtml]) => {
            const navDoc = new DOMParser().parseFromString(navHtml, "text/html");
            const navContent = navDoc.body;

            const headerTarget = document.getElementById("page-nav-header");
            const footerTarget = document.getElementById("page-nav-footer");

            // Navigation im Header einfügen
            if (headerTarget) {
              headerTarget.innerHTML = navContent.innerHTML;
            }

            // Navigation im Footer einfügen (Klonen)
            if (footerTarget) {
              footerTarget.innerHTML = navContent.innerHTML;
            }

            // Aktiven Link in beiden Navigationsleisten markieren
            const current = window.location.pathname;
            document.querySelectorAll(".main-navigation a").forEach((link) => {
              const linkPath = link.pathname;
              if (current === linkPath || (linkPath !== "/" && current.startsWith(linkPath + "/"))) {
                link.classList.add("active");
              }
            });
          })
          .catch((err) => console.warn("Nav/Footer-Ladefehler:", err));
      });
      /*]]>*/
    </script>
  </body>
</html>
