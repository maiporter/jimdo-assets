    <script type="text/javascript">
      /* <![CDATA[ */
      document.addEventListener("DOMContentLoaded", function () {
        const isLocal = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";

        // Hier deine echte raw.githack.com-Basis-URL eintragen (wie bei vorlage.html):
        const githackBase = "https://raw.githack.com/maiporter/maiporter-assets/main/templates/pages/vorlage.html";

        const headerUrl = isLocal
          ? "../../templates/navigation/page-header.html"
          : `${githackBase}/templates/navigation/page-header.html`;

        const navUrl = isLocal
          ? "../../templates/navigation/page-navigation.html"
          : `${githackBase}/templates/navigation/page-navigation.html`;

        // Header laden
        fetch(headerUrl)
          .then((res) => {
            if (!res.ok) throw new Error("HTTP-Fehler: " + res.status);
            return res.text();
          })
          .then((html) => {
            const container = document.getElementById("page-header-container");
            if (container) container.innerHTML = html;
          })
          .catch((err) => console.warn("Header-Fehler:", err));

        // Navigation laden und speichern
        fetch(navUrl)
          .then((res) => {
            if (!res.ok) throw new Error("HTTP-Fehler: " + res.status);
            return res.text();
          })
          .then((navHtml) => {
            const navDoc = new DOMParser().parseFromString(navHtml, "text/html");
            const navContent = navDoc.body.innerHTML;

            // Im Header einfügen
            const headerTarget = document.getElementById("page-nav-header");
            if (headerTarget) {
              headerTarget.innerHTML = navContent;
              markActiveLinks(headerTarget);
            }

            // Hilfsfunktion für den Footer bereitstellen
            window.injectFooterNav = function () {
              const footerTarget = document.getElementById("page-nav-footer");
              if (footerTarget) {
                footerTarget.innerHTML = navContent;
                markActiveLinks(footerTarget);
              }
            };

            // Falls der Footer schon fertig geladen ist, direkt einfügen
            window.injectFooterNav();
          })
          .catch((err) => console.warn("Nav-Fehler:", err));

        function markActiveLinks(scope) {
          const current = window.location.pathname;
          scope.querySelectorAll(".main-navigation a").forEach((link) => {
            const linkPath = link.pathname;
            if (current === linkPath || (linkPath !== "/" && current.startsWith(linkPath + "/"))) {
              link.classList.add("active");
            }
          });
        }
      });
    </script>
