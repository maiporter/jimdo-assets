<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaiPorter - SEITENTITEL</title>

    <!-- Eigene Styles (2 Ebenen nach oben) -->
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <!-- HEADER CONTAINER & SKRIPT -->
    <div id="global-header" style="min-height: 180px"></div>

    <script type="text/javascript">
      /* <![CDATA[ */
      document.addEventListener("DOMContentLoaded", function () {
        const isLocal = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";

        // Zeigt lokal auf templates/navigation/site-header.html (1 Ebene nach oben)
        const headerUrl = isLocal ? "../navigation/site-header.html" : "/navigation/header";

        fetch(headerUrl)
          .then((res) => {
            if (!res.ok) throw new Error("HTTP Fehler Status: " + res.status);
            return res.text();
          })
          .then((data) => {
            const container = document.getElementById("global-header");
            if (!container) return;

            const doc = new DOMParser().parseFromString(data, "text/html");
            const header = doc.querySelector(".site-header");
            container.innerHTML = header ? header.outerHTML : data;
            const current = window.location.pathname;
            container.querySelectorAll(".main-navigation a").forEach((link) => {
              const linkPath = link.pathname;
              if (current === linkPath || (linkPath !== "/" && current.startsWith(linkPath + "/"))) {
                link.classList.add("active");
              }
            });
          })
          .catch((err) => {
            console.warn("Header konnte lokal nicht geladen werden:", err.message);
          });
      });
      /*]]>*/
    </script>

    <div class="page-title">
      <h1>VORLAGE</h1>
      <div>
        <svg class="mai-line line-1" width="100%" height="5">
          <line class="svg-line" x1="0" y1="4.5" x2="100%" y2="4.5"></line>
        </svg>
      </div>
    </div>

    <div class="v2-wrapper">
      <!-- SEITENINHALT -->
    </div>

    <!-- SKRIPT: JIMDO STYLE-ISOLIERUNG FÜR V2-WRAPPER -->
    <script type="text/javascript">
      /* <![CDATA[ */
      document.addEventListener("DOMContentLoaded", function () {
        const wrappers = document.querySelectorAll(".v2-wrapper");
        wrappers.forEach((wrapper) => {
          const affectedElements = wrapper.querySelectorAll(".j-text, .j-htmlCode, .cc-m-spacer, .j-moduleBox");
          affectedElements.forEach((el) => {
            el.style.setProperty("all", "unset", "important");
            el.style.setProperty("display", "block", "important");
          });
        });
      });
      /*]]>*/
    </script>

    <!-- FOOTER CONTAINER & SKRIPT -->
    <footer id="global-footer"></footer>

    <script type="text/javascript">
      /* <![CDATA[ */
      document.addEventListener("DOMContentLoaded", function () {
        const isLocal = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";

        // Zeigt lokal auf templates/navigation/site-footer.html (1 Ebene nach oben)
        const footerUrl = isLocal ? "../navigation/site-footer.html" : "/navigation/footer";

        fetch(footerUrl)
          .then((res) => {
            if (!res.ok) throw new Error("HTTP Fehler Status: " + res.status);
            return res.text();
          })
          .then((data) => {
            const doc = new DOMParser().parseFromString(data, "text/html");
            const footer = doc.querySelector(".site-footer");
            const container = document.getElementById("global-footer");

            if (footer && container) {
              container.appendChild(footer);
              const current = window.location.pathname;
              footer.querySelectorAll(".main-navigation a").forEach((link) => {
                const href = new URL(link.href, window.location.origin).pathname;
                if (current === href || (href !== "/" && current.startsWith(href + "/"))) {
                  link.classList.add("active");
                }
              });
            }
          })
          .catch((err) => {
            console.warn("Footer konnte lokal nicht geladen werden:", err.message);
          });
      });
      /*]]>*/
    </script>
    <footer class="legal-footer">
      <div class="footer-container">
        <!-- 1. Rechtlicher Hinweis / MwSt -->
        <p class="footer-note"><sup>1</sup> inkl. MwSt.</p>

        <!-- 2. Navigation / Rechtslinks -->
        <nav class="footer-links" aria-label="Rechtliche Links">
          <a href="/impressum/">Impressum</a>
          <span class="divider">|</span>
          <a href="//www.maiporter.de/j/shop/withdrawal">Widerrufsbelehrung</a>
          <span class="divider">|</span>
          <a href="//www.maiporter.de/j/shop/deliveryinfo" data-meta-link="shop_delivery_info">Liefer- und Zahlungsbedingungen</a>
          <span class="divider">|</span>
          <a href="//www.maiporter.de/j/privacy">Datenschutz</a>
          <span class="divider">|</span>
          <a id="cookie-policy" href="javascript:window.CookieControl.showCookieSettings();">Cookie-Richtlinie</a>
          <span class="divider">|</span>
          <a href="/sitemap/">Sitemap</a>
          <span class="divider">|</span>
          <a href="//www.maiporter.de/j/legal-guarantee" data-meta-link="legal_guarantee_notice" target="_blank" rel="noopener"
            >Gesetzliche Gewährleistung</a
          >
          <span class="divider">|</span>
          <a
            href="//www.maiporter.de/j/withdrawal"
            class="withdrawal-btn"
            data-meta-link="withdrawal_button"
            data-website-id="23171630"
            >Vertrag widerrufen</a
          >
        </nav>
      </div>
    </footer>
  </body>
</html>
