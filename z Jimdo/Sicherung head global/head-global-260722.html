<script type="text/javascript">
  //<![CDATA[

  // --- STANDARD SLIDER (Schieben) ---
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".slider-frame.is-standard").forEach((frame) => {
      const track = frame.querySelector(".slide-track");
      const slides = frame.querySelectorAll(".slide");
      const thumbs = frame.querySelectorAll(".thumbs picture");
      const count = slides.length;
      if (count === 0 || !track) return;

      let currentIndex = 0;
      let isTransitioning = false;

      // --- SLIDE UPDATEN ---
      const goToSlide = (index, instant = false) => {
        if (isTransitioning && !instant) return;
        if (index < 0) index = count - 1;
        if (index >= count) index = 0;
        if (index === currentIndex && !instant) return;

        isTransitioning = true;
        currentIndex = index;

        // Track verschieben
        track.style.transition = instant ? "none" : "transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
        track.style.transform = `translateX(-${currentIndex * 100}%)`;

        // Thumbs aktualisieren
        thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));

        // Transition zurücksetzen
        setTimeout(
          () => {
            isTransitioning = false;
          },
          instant ? 50 : 550,
        );
      };

      // --- NAVIGATION ---
      const nextSlide = () => goToSlide(currentIndex + 1);
      const prevSlide = () => goToSlide(currentIndex - 1);

      const triggerArrowFeedback = (dir) => {
        const arrow = frame.querySelector(`.arrow-${dir}`);
        if (arrow) {
          arrow.classList.add("is-active");
          setTimeout(() => arrow.classList.remove("is-active"), 150);
        }
      };

      // --- KLICK AUF BILD (Hälften) ---
      const sliderBtn = frame.querySelector(".slider");
      if (sliderBtn) {
        sliderBtn.onclick = (e) => {
          if (e.target.closest(".thumbs")) return;
          if (e.target.closest(".slider-arrow")) return;
          if (document.activeElement) document.activeElement.blur();

          const rect = sliderBtn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          x < rect.width / 2 ? prevSlide() : nextSlide();
        };

        // --- SWIPE ---
        let touchStartX = 0,
          touchStartY = 0;
        sliderBtn.addEventListener(
          "touchstart",
          (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
          },
          { passive: true },
        );

        sliderBtn.addEventListener(
          "touchend",
          (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            const absX = Math.abs(diffX);
            const absY = Math.abs(diffY);

            if (absX > absY * 0.8 && absX > 30) {
              diffX > 0 ? prevSlide() : nextSlide();
            }
          },
          { passive: true },
        );
      }

      // --- PFEILE KLICK ---
      frame.querySelectorAll(".slider-arrow").forEach((arrow) => {
        arrow.onclick = (e) => {
          e.stopPropagation();
          if (arrow.classList.contains("arrow-prev")) {
            prevSlide();
            triggerArrowFeedback("prev");
          } else {
            nextSlide();
            triggerArrowFeedback("next");
          }
        };
      });

      // --- THUMBS ---
      thumbs.forEach((t, i) => {
        t.onclick = (e) => {
          e.stopPropagation();
          if (i === currentIndex) return;
          goToSlide(i);
        };
      });

      // --- TASTATUR ---
      window.addEventListener("keydown", (e) => {
        const rect = frame.getBoundingClientRect();
        const isInViewport = rect.top < window.innerHeight && rect.bottom > 0;
        if (!isInViewport) return;

        if (e.key === "ArrowLeft") prevSlide();
        if (e.key === "ArrowRight") nextSlide();
      });

      // --- INIT ---
      goToSlide(0, true);
    });
  });

  // --- SLIDER MORPHER ---
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".slider-frame.is-morpher").forEach((frame) => {
      const slides = frame.querySelectorAll(".slide");
      const thumbs = frame.querySelectorAll(".thumbs picture");
      const count = slides.length;
      if (count === 0) return;

      let idx = 0,
        lastIdx = 0;

      // --- HILFSFUNKTIONEN FÜR NAVIGATION ---
      const nextSlide = () => {
        lastIdx = idx;
        idx = (idx + 1) % count;
        updateMorph(false);
        triggerArrowFeedback("next");
      };
      const prevSlide = () => {
        lastIdx = idx;
        idx = (idx - 1 + count) % count;
        updateMorph(false);
        triggerArrowFeedback("prev");
      };

      const triggerArrowFeedback = (dir) => {
        const arrow = frame.querySelector(`.arrow-${dir}`);
        if (arrow) {
          arrow.classList.add("is-active");
          setTimeout(() => arrow.classList.remove("is-active"), 150);
        }
      };

      const updateMorph = (instant) => {
        slides.forEach((s, i) => {
          s.style.transition = instant ? "none" : "opacity 1s linear";
          s.classList.remove("active", "last-active");
          if (i === idx) s.classList.add("active");
          if (i === lastIdx) s.classList.add("last-active");
        });
        // Loop-Back Logik (falls das letzte Bild geklont ist)
        if (idx === count - 1 && !instant) {
          setTimeout(() => {
            if (idx === count - 1) {
              lastIdx = 0;
              idx = 0;
              updateMorph(true);
            }
          }, 1000);
        }
        thumbs.forEach((t, i) => t.classList.toggle("active", i === idx));
      };

      // --- KLICK-LOGIK (BILDHÄLFTEN) ---
      const sliderBtn = frame.querySelector(".slider");
      if (sliderBtn) {
        sliderBtn.onclick = (e) => {
          if (e.target.closest(".thumbs")) return;
          if (document.activeElement) document.activeElement.blur();

          const rect = sliderBtn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          x < rect.width / 2 ? prevSlide() : nextSlide();
        };

        // --- SWIPE-LOGIK (MIT TOLERANZ FÜR SCHRÄGE WISCHER) ---
        let touchStartX = 0,
          touchStartY = 0;
        sliderBtn.addEventListener(
          "touchstart",
          (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
          },
          { passive: true },
        );

        sliderBtn.addEventListener(
          "touchend",
          (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            const absX = Math.abs(diffX);
            const absY = Math.abs(diffY);

            // Erkennt waagerecht auch bei Schräglage (X muss nur etwas dominanter sein als Y)
            if (absX > absY * 0.8 && absX > 30) {
              diffX > 0 ? prevSlide() : nextSlide();
            }
          },
          { passive: true },
        );
      }

      // --- PFEILTASTEN-STEUERUNG ---
      window.addEventListener("keydown", (e) => {
        const rect = frame.getBoundingClientRect();
        const isInViewport = rect.top < window.innerHeight && rect.bottom > 0;
        if (!isInViewport) return;

        if (e.key === "ArrowLeft") prevSlide();
        if (e.key === "ArrowRight") nextSlide();
      });

      // --- THUMBS NAVIGATION ---
      thumbs.forEach((t, i) => {
        t.onclick = (e) => {
          e.stopPropagation();
          if (i === idx) return;
          lastIdx = idx;
          idx = i;
          updateMorph(false);
        };
      });

      updateMorph(true);
    });
  });
  //]]>
</script>

<script type="text/javascript">
  //<![CDATA[
  document.addEventListener("DOMContentLoaded", function () {
    function updatePhoneLabel() {
      const label = document.querySelector("#billing_telephone label.j-checkout__input-label");

      if (!label) return false;

      const addition = " (gerne angeben)";

      if (!label.textContent.includes(addition)) {
        label.textContent += addition;
      }

      return true;
    }
    if (updatePhoneLabel()) return;
    const observer = new MutationObserver(() => {
      if (updatePhoneLabel()) observer.disconnect();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true,
    });
  });
  //]]>
</script>

<script type="text/javascript">
  //<![CDATA[ // NACHRICHTENFORMULAR
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector('form[action*="formspree.io"]');
    if (!form) return;

    const nameInput = form.querySelector("[name='name']");
    const emailInput = form.querySelector("[name='email']");
    const messageInput = form.querySelector("[name='message']");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      if (!nameInput?.value.trim() || !emailInput?.value.trim() || !messageInput?.value.trim()) {
        alert("❌ Bitte alle Felder ausfüllen.");
        return;
      }

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: { Accept: "application/json" },
          body: formData,
        });

        if (response.ok) {
          window.location.href = "https://www.maiporter.de/erfolg";
        } else {
          const data = await response.json();
          const msg = data?.errors?.[0]?.message || "Unbekannter Fehler.";
          alert("❌ Fehler: " + msg);
        }
      } catch (err) {
        alert("❌ Es ist ein Fehler beim Senden aufgetreten.");
        console.error(err);
      }
    });
  });
  //]]>
</script>

<script type="text/javascript">
  //<![CDATA[
  // WEITERLEITUNG ZU EIGENEN SEITEN ZAHLUNG VERSAND - DATENSCHUTZ - WIDERRUF
  (function () {
    const redirects = {
      "/j/shop/info/m/": "https://www.maiporter.de/versand-zahlung",
      "/j/shop/deliveryinfo": "https://www.maiporter.de/versand-zahlung",
      "/j/shop/withdrawal": "https://www.maiporter.de/widerrufsbelehrung",
      "/j/privacy": "https://www.maiporter.de/datenschutz",
    };

    document.addEventListener("DOMContentLoaded", function () {
      const currentPath = window.location.pathname;
      const searchParams = new URLSearchParams(window.location.search);

      const isProductPage = currentPath === "/j/shop/info/m/" && searchParams.has("productId");

      if (isProductPage && redirects["/j/shop/info/m/"]) {
        window.location.href = redirects["/j/shop/info/m/"];
      } else if (redirects[currentPath]) {
        window.location.href = redirects[currentPath];
      }

      // Klick-Redirect bei internen Links
      document.body.addEventListener(
        "click",
        function (e) {
          const target = e.target.closest("a");
          if (!target) return;

          try {
            const url = new URL(target.href, window.location.origin);
            const isProductClick = url.pathname === "/j/shop/info/m/" && url.searchParams.has("productId");

            if ((isProductClick && redirects["/j/shop/info/m/"]) || redirects[url.pathname]) {
              e.preventDefault();
              window.location.href = isProductClick ? redirects["/j/shop/info/m/"] : redirects[url.pathname];
            }
          } catch (err) {
            // Fehlerhafte URLs ignorieren
          }
        },
        true,
      );
    });
  })();
  //]]>
</script>

<script type="text/javascript">
  //<![CDATA[
  // TOOLTIPPS 2487
  function removeTooltip() {
    const old = document.querySelector(".tooltipbox");
    if (old) old.remove();
  }

  function showTooltip(el) {
    const tooltipText = el.getAttribute("data-tooltip");
    const tooltipPic = el.getAttribute("data-pic");
    const tooltip = document.createElement("div");
    tooltip.className = "tooltipbox visible";

    if (tooltipPic) {
      tooltip.innerHTML = `
      <img src="${tooltipPic}" alt="" style="max-width:280px; height:auto; display:block; margin-bottom:0.4em;">
      ${tooltipText ? `<div>${tooltipText}<\/div>` : ""}
    `;
    } else {
      tooltip.textContent = tooltipText;
    }

    document.body.appendChild(tooltip);

    const rect = el.getBoundingClientRect();
    const tipRect = tooltip.getBoundingClientRect();

    let top = rect.top + window.scrollY - tipRect.height - 8;
    let left = rect.left + window.scrollX + rect.width / 2 - tipRect.width / 2;

    left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
    if (top < window.scrollY + 8) {
      top = rect.bottom + window.scrollY + 8;
    }

    tooltip.style.top = `${top}px`;
    tooltip.style.left = `${left}px`;
  }

  document.addEventListener("click", function (e) {
    removeTooltip();
    if (e.target.classList.contains("tooltipwort")) {
      showTooltip(e.target);
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".tooltipwort").forEach((el) => {
      el.addEventListener("mouseenter", () => {
        removeTooltip();
        showTooltip(el);
      });
      el.addEventListener("mouseleave", removeTooltip);
    });
  });
  //]]>
</script>

<script defer="defer">
  /* <![CDATA[ */
  // EASTEREGG- UND TEXT-AKKORDEON
  document.addEventListener("DOMContentLoaded", function () {
    const akkordeonContainer = document.querySelectorAll(".akkordeon-text, .akkordeon-text-easteregg");

    akkordeonContainer.forEach(function (container) {
      const links = container.querySelectorAll("dt a");
      const isEasteregg = container.classList.contains("akkordeon-text-easteregg");
      const bgColor = isEasteregg ? "rgba(223, 251, 227, 0.7)" : "rgba(241, 245, 250, 0.7)";
      const bgColorTransparent = "rgba(241, 245, 250, 0)";

      links.forEach(function (link) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          const dt = link.closest("dt");
          const dd = dt.nextElementSibling;
          const viewportWidth = window.innerWidth;

          let slideDownDuration, slideUpDuration;
          if (viewportWidth > 1200) {
            slideDownDuration = 1200;
            slideUpDuration = 300;
          } else if (viewportWidth > 800) {
            slideDownDuration = 1000;
            slideUpDuration = 250;
          } else if (viewportWidth > 500) {
            slideDownDuration = 800;
            slideUpDuration = 200;
          } else {
            slideDownDuration = 600;
            slideUpDuration = 150;
          }

          if (dd.style.display === "none" || !dd.style.display) {
            dd.style.display = "block";
            const maxHeight = dd.scrollHeight + "px";
            const animation = dd.animate(
              [
                { height: "0px", backgroundColor: bgColorTransparent },
                { height: maxHeight, backgroundColor: bgColor },
              ],
              {
                duration: slideDownDuration,
                easing: "ease-out",
                fill: "forwards",
              },
            );
            animation.onfinish = () => {
              dd.style.backgroundColor = bgColor;
            };
            link.classList.remove("closed");
            link.classList.add("opened");
            link.setAttribute("aria-expanded", "true");
          } else {
            const maxHeight = dd.scrollHeight + "px";
            const animation = dd.animate(
              [
                { height: maxHeight, backgroundColor: bgColor },
                { height: "0px", backgroundColor: bgColorTransparent },
              ],
              {
                duration: slideUpDuration,
                easing: "ease-in",
                fill: "forwards",
              },
            );
            animation.onfinish = () => {
              dd.style.display = "none";
              dd.style.backgroundColor = bgColorTransparent;
            };
            link.classList.remove("opened");
            link.classList.add("closed");
            link.setAttribute("aria-expanded", "false");
          }
        });
      });
    });
  });

  /* ]]> */
</script>

  /* === MEDIA-FRAME BASIS-STRUKTUR === */
  .media-frame {
    display: flex;
    justify-content: center;
    margin-inline: auto;
    margin-block: 50px;
    max-width: 100%;
  }

  .media-frame img {
    width: 100%;
    height: auto;
    display: block;
    /* Verhindert, dass das Bild höher wird als der Bildschirm minus ein bisschen Platz */
    max-height: 85vh;
    object-fit: contain; /* Sorgt dafür, dass das Bild innerhalb dieser Höhe bleibt ohne zu verzerren */
      /* DER UNTERBEWUSSTE SCHATTEN */
    /* x-Achse: 0 | y-Achse: 4px nach unten | Weichzeichner: 20px | Farbe: Schwarz mit 7% Deckkraft */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
  }
  .img-square {
      max-width: 600px !important;
      max-height: 70vh;
      height: auto;        /* Verhindert Verzerrung */

      display: block;      /* Ermöglicht Zentrierung */
      margin: 20px auto
  }
  /* === BREITEN-KLASSEN (DESKTOP) === */
  /* % statt vw: Orientiert sich am Inhaltsbereich, nicht an der Fensterkante */
  .media-frame-20  { width: 20%; }
  .media-frame-30  { width: 30%; }
  .media-frame-40  { width: 40%; }
  .media-frame-50  { width: 50%; }
  .media-frame-60  { width: 60%; }
  .media-frame-70  { width: 70%; }
  .media-frame-80  { width: 80%; }
  .media-frame-90  { width: 90%; }
  .media-frame-100 { width: 100%; }

  /* === RESPONSIVE ANPASSUNGEN === */

  /* Tablets & kleine Laptops: Hier geben wir den Bildern etwas mehr Raum */
  @media (max-width: 1440px) {
    .media-frame-40 { width: 50%; }

    .media-frame-70 { width: 85%; }
    .media-frame-80 { width: 95%; }

  @media (max-width: 719px) {
    .media-frame-20, .media-frame-30, .media-frame-40,

        ============================================================ */
        .slider-frame {
          width: 100%;
          margin: 40px auto;
          max-width: 900px;
          position: relative;
        }

        .slider {
          background: #ffffff;
          position: relative;
          cursor: pointer;
          touch-action: pan-y;
          overflow: hidden;
        }

        .slides {
          position: relative;
          width: 100%;
          overflow: hidden;
        }

        /* --- SYSTEM: STANDARD (Schieben) --- */
        .slide-track {
          display: flex !important;
          transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .slide {
          min-width: 100%;
          max-width: 100%;
          flex-shrink: 0;
        }

        .slide img,
        .slide picture img {
          display: block;
          width: 100%;
          height: auto;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
        }

        /* --- PFEILE --- */
        .slider-arrow {
          opacity: 0.3;
          background: rgba(0, 0, 0, 0.3);
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 34px;
          height: 34px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 100;
          cursor: pointer;
          border: none;
          color: white;
          transition: all 0.3s ease;
          user-select: none;
          -webkit-user-select: none;
          -moz-user-select: none;
        }

        .slider-arrow.is-active {
          opacity: 0.1 !important;
          transform: translateY(-50%) scale(0.9);
