<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Wiper / Vorher-Nachher Slider</title>
    <style>
      .wiper-frame {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        margin: 0 auto;
        --pos: 38px;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
      }

      .wiper-frame picture,
      .wiper-frame img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0 !important;
      }

      .wiper-frame img {
        object-fit: cover;
        pointer-events: none;
      }

      .wiper-front {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        clip-path: inset(0 calc(100% - var(--pos)) 0 0);
        pointer-events: none;
      }

      .wiper-line {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--pos);
        width: 4px;
        background-color: #888888;
        opacity: 0.7;
        z-index: 3;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .wiper-button {
        position: absolute;
        top: 50%;
        left: var(--pos);
        width: 60px;
        height: 60px;
        background-image: url("https://img-mp.maiporter.de/wiper-handle.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 4;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .wiper-touch-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--pos);
        width: 200px;
        transform: translateX(-50%);
        z-index: 5;
        cursor: ew-resize;
        touch-action: none;
      }

      @media (max-width: 600px) {
        .wiper-button {
          width: 55px;
          height: 55px;
        }
      }

      @media (max-width: 540px) {
        .wiper-frame {
          aspect-ratio: 11 / 10;
          --pos: 28px;
        }

        .wiper-button {
          width: 45px;
          height: 45px;
        }
      }

      @media (max-width: 413px) {
        .wiper-frame {
          --pos: 26px;
        }

        .wiper-button {
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wiper-frame">
      <picture class="wiper-back">
        <source
          media="(max-width: 540px)"
          srcset="https://img-mp.maiporter.de/wiper-federfallgriff-ohne-mb.avif"
          type="image/avif" />
        <source
          media="(max-width: 540px)"
          srcset="https://img-mp.maiporter.de/wiper-federfallgriff-ohne-mb.webp"
          type="image/webp" />
        <source
          media="(max-width: 540px)"
          srcset="https://img-mp.maiporter.de/wiper-federfallgriff-ohne-mb.jpg"
          type="image/jpeg" />

        <source srcset="https://img-mp.maiporter.de/wiper-federfallgriff-ohne-dt.avif" type="image/avif" />
        <source srcset="https://img-mp.maiporter.de/wiper-federfallgriff-ohne-dt.webp" type="image/webp" />

        <img
          src="https://img-mp.maiporter.de/wiper-federfallgriff-ohne-dt.jpg"
          alt="MaiPorter Boxtrailer Heckansicht"
          width="1600"
          height="1000"
          fetchpriority="high"
          decoding="async" />
      </picture>

      <div class="wiper-front">
        <picture>
          <source
            media="(max-width: 540px)"
            srcset="https://img-mp.maiporter.de/wiper-federfallgriff-mb.avif"
            type="image/avif" />
          <source
            media="(max-width: 540px)"
            srcset="https://img-mp.maiporter.de/wiper-federfallgriff-mb.webp"
            type="image/webp" />
          <source media="(max-width: 540px)" srcset="https://img-mp.maiporter.de/wiper-federfallgriff-mb.png" type="image/png" />

          <source srcset="https://img-mp.maiporter.de/wiper-federfallgriff-dt.avif" type="image/avif" />
          <source srcset="https://img-mp.maiporter.de/wiper-federfallgriff-dt.webp" type="image/webp" />

          <img
            src="https://img-mp.maiporter.de/wiper-federfallgriff-dt.png"
            alt="Federfallgriff"
            width="1600"
            height="1000"
            loading="eager"
            decoding="async"
            data-nosnippet="" />
        </picture>
      </div>

      <div class="wiper-line"></div>
      <div class="wiper-button"></div>
      <div class="wiper-touch-zone"></div>
    </div>

    <script>
      (function () {
        function initWipers() {
          const wipers = document.querySelectorAll(".wiper-frame");
          wipers.forEach(function (wiper) {
            if (wiper.dataset.wiperReady) return;
            wiper.dataset.wiperReady = "true";

            const touchZone = wiper.querySelector(".wiper-touch-zone");
            if (!touchZone) return;

            let isDragging = false;

            function setPosition(pageX) {
              const rect = wiper.getBoundingClientRect();
              const radius = window.innerWidth <= 540 ? 20 : 30;

              let x = pageX - rect.left;

              const minX = radius + 3;
              const maxX = rect.width - radius + 3;

              if (x < minX) x = minX;
              if (x > maxX) x = maxX;

              wiper.style.setProperty("--pos", x + "px");
            }

            touchZone.addEventListener("pointerdown", function (e) {
              isDragging = true;
              touchZone.setPointerCapture(e.pointerId);
              setPosition(e.clientX);
            });

            touchZone.addEventListener("pointermove", function (e) {
              if (!isDragging) return;
              setPosition(e.clientX);
            });

            const stopDragging = function (e) {
              if (isDragging) {
                isDragging = false;
                try {
                  touchZone.releasePointerCapture(e.pointerId);
                } catch (err) {}
              }
            };

            touchZone.addEventListener("pointerup", stopDragging);
            touchZone.addEventListener("pointercancel", stopDragging);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initWipers);
        } else {
          initWipers();
        }
      })();
    </script>
  </body>
</html>
