<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standard Slider</title>
    <style>
      /* ============================================================
      STANDARD SLIDER
      ============================================================ */
      .slider-frame {
        width: 100%;
        margin: 40px auto;
        max-width: 900px;
        position: relative;
      }

      .slider {
        background: #ffffff;
        position: relative;
        cursor: pointer;
        touch-action: pan-y;
        overflow: hidden;
      }

      .slides {
        position: relative;
        width: 100%;
        overflow: hidden;
      }

      /* --- SYSTEM: STANDARD (Schieben) --- */
      .slide-track {
        display: flex !important;
        transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .slide {
        min-width: 100%;
        max-width: 100%;
        flex-shrink: 0;
      }

      .slide img,
      .slide picture img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* --- PFEILE --- */
      .slider-arrow {
        opacity: 0.3;
        background: rgba(0, 0, 0, 0.3);
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        cursor: pointer;
        border: none;
        color: white;
        transition: all 0.3s ease;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
      }

      .slider-arrow.is-active {
        opacity: 0.1 !important;
        transform: translateY(-50%) scale(0.9);
      }

      @media (hover: hover) {
        .slider-arrow:hover {
          opacity: 0.5;
        }
      }

      .arrow-prev {
        left: 15px;
      }
      .arrow-next {
        right: 15px;
      }

      .slider-arrow svg {
        width: 20px;
        height: 20px;
        fill: white;
      }

      /* --- THUMBNAILS --- */
      .thumbs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        padding-bottom: 10px;
      }

      .thumbs picture {
        width: var(--thumb-width, 100px);
        max-width: var(--thumb-max-width, 22%);
        opacity: 0.4;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .thumbs img {
        width: 100%;
        display: block;
        aspect-ratio: var(--thumb-ratio, 4 / 3);
        object-fit: cover;
      }

      .thumbs picture.active {
        opacity: 1;
        transform: scale(1.08);
      }

      /* --- RESPONSIVE --- */
      @media (max-width: 719px) {
        .slider-frame {
          max-width: 500px;
        }

        .thumbs picture {
          width: var(--thumb-width-mobile, 70px);
          max-width: var(--thumb-max-width, 22%);
        }

        .thumbs img {
          aspect-ratio: var(--thumb-ratio-mobile, var(--thumb-ratio, 130 / 149));
        }

        .slider-arrow {
          width: 30px;
          height: 30px;
          pointer-events: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- STANDARD SLIDER (OHNE KLON) -->
    <div class="slider-frame is-standard">
      <div class="slider">
        <div class="slides">
          <!-- PFEILE -->
          <div class="slider-arrow arrow-prev">
            <svg viewbox="0 0 24 24">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
            </svg>
          </div>

          <div class="slider-arrow arrow-next">
            <svg viewbox="0 0 24 24">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path>
            </svg>
          </div>

          <!-- SLIDE-TRACK -->
          <div class="slide-track">
            <!-- BILD 1 -->
            <div class="slide">
              <picture>
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild1-mb.webp" type="image/webp" />
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild1-mb.jpg" />
                <source srcset="https://img-mp.maiporter.de/bild1-dt.webp" type="image/webp" />
                <img src="https://img-mp.maiporter.de/bild1-dt.jpg" alt="1" fetchpriority="high" />
              </picture>
            </div>

            <!-- BILD 2 -->
            <div class="slide">
              <picture>
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild2-mb.webp" type="image/webp" />
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild2-mb.jpg" />
                <source srcset="https://img-mp.maiporter.de/bild2-dt.webp" type="image/webp" />
                <img src="https://img-mp.maiporter.de/bild2-dt.jpg" alt="" loading="lazy" />
              </picture>
            </div>

            <!-- BILD 3 -->
            <div class="slide">
              <picture>
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild3-mb.webp" type="image/webp" />
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild3-mb.jpg" />
                <source srcset="https://img-mp.maiporter.de/bild3-dt.webp" type="image/webp" />
                <img src="https://img-mp.maiporter.de/bild3-dt.jpg" alt="" loading="lazy" />
              </picture>
            </div>

            <!-- BILD 4 -->
            <div class="slide">
              <picture>
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild4-mb.webp" type="image/webp" />
                <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/bild4-mb.jpg" />
                <source srcset="https://img-mp.maiporter.de/bild4-dt.webp" type="image/webp" />
                <img src="https://img-mp.maiporter.de/bild4-dt.jpg" alt="" loading="lazy" />
              </picture>
            </div>
          </div>
        </div>

        <!-- THUMBNAILS -->
        <div class="thumbs">
          <picture class="active">
            <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/-1-thumb-mb.jpg" />
            <img src="https://img-mp.maiporter.de/-1-dt.jpg" alt="" />
          </picture>
          <picture>
            <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/-2-mb.jpg" />
            <img src="https://img-mp.maiporter.de/-2-dt.jpg" alt="" />
          </picture>
          <picture>
            <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/-3-thumb-mb.jpg" />
            <img src="https://img-mp.maiporter.de/-3-dt.jpg" alt="" />
          </picture>
          <picture>
            <source media="(max-width: 719px)" srcset="https://img-mp.maiporter.de/-4-mb.jpg" />
            <img src="https://img-mp.maiporter.de/-4-dt.jpg" alt="" />
          </picture>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      //<![CDATA[
      // --- STANDARD SLIDER (Schieben) ---
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".slider-frame.is-standard").forEach((frame) => {
          const track = frame.querySelector(".slide-track");
          const slides = frame.querySelectorAll(".slide");
          const thumbs = frame.querySelectorAll(".thumbs picture");
          const count = slides.length;
          if (count === 0 || !track) return;

          let currentIndex = 0;
          let isTransitioning = false;

          // --- SLIDE UPDATEN ---
          const goToSlide = (index, instant = false) => {
            if (isTransitioning && !instant) return;
            if (index < 0) index = count - 1;
            if (index >= count) index = 0;
            if (index === currentIndex && !instant) return;

            isTransitioning = true;
            currentIndex = index;

            // Track verschieben
            track.style.transition = instant ? "none" : "transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
            track.style.transform = `translateX(-${currentIndex * 100}%)`;

            // Thumbs aktualisieren
            thumbs.forEach((t, i) => t.classList.toggle("active", i === currentIndex));

            // Transition zurücksetzen
            setTimeout(
              () => {
                isTransitioning = false;
              },
              instant ? 50 : 550,
            );
          };

          // --- NAVIGATION ---
          const nextSlide = () => goToSlide(currentIndex + 1);
          const prevSlide = () => goToSlide(currentIndex - 1);

          const triggerArrowFeedback = (dir) => {
            const arrow = frame.querySelector(`.arrow-${dir}`);
            if (arrow) {
              arrow.classList.add("is-active");
              setTimeout(() => arrow.classList.remove("is-active"), 150);
            }
          };

          // --- KLICK AUF BILD (Hälften) ---
          const sliderBtn = frame.querySelector(".slider");
          if (sliderBtn) {
            sliderBtn.onclick = (e) => {
              if (e.target.closest(".thumbs")) return;
              if (e.target.closest(".slider-arrow")) return;
              if (document.activeElement) document.activeElement.blur();

              const rect = sliderBtn.getBoundingClientRect();
              const x = e.clientX - rect.left;
              x < rect.width / 2 ? prevSlide() : nextSlide();
            };

            // --- SWIPE ---
            let touchStartX = 0,
              touchStartY = 0;
            sliderBtn.addEventListener(
              "touchstart",
              (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
              },
              { passive: true },
            );

            sliderBtn.addEventListener(
              "touchend",
              (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                const absX = Math.abs(diffX);
                const absY = Math.abs(diffY);

                if (absX > absY * 0.8 && absX > 30) {
                  diffX > 0 ? prevSlide() : nextSlide();
                }
              },
              { passive: true },
            );
          }

          // --- PFEILE KLICK ---
          frame.querySelectorAll(".slider-arrow").forEach((arrow) => {
            arrow.onclick = (e) => {
              e.stopPropagation();
              if (arrow.classList.contains("arrow-prev")) {
                prevSlide();
                triggerArrowFeedback("prev");
              } else {
                nextSlide();
                triggerArrowFeedback("next");
              }
            };
          });

          // --- THUMBS ---
          thumbs.forEach((t, i) => {
            t.onclick = (e) => {
              e.stopPropagation();
              if (i === currentIndex) return;
              goToSlide(i);
            };
          });

          // --- TASTATUR ---
          window.addEventListener("keydown", (e) => {
            const rect = frame.getBoundingClientRect();
            const isInViewport = rect.top < window.innerHeight && rect.bottom > 0;
            if (!isInViewport) return;

            if (e.key === "ArrowLeft") prevSlide();
            if (e.key === "ArrowRight") nextSlide();
          });

          // --- INIT ---
          goToSlide(0, true);
        });
      });
      //]]>
    </script>
  </body>
</html>
